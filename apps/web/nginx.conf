# Serves the built SPA. try_files falls back to index.html for any path
# that isn't a real static asset, so client-side routes (react-router,
# e.g. /decisions/<id>) work on a hard refresh, not just via in-app nav.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Plain container liveness check -- confirms nginx itself is up, not
    # a proxy to the API (see /api/v1/health for that). Kept separate
    # from index.html so a healthcheck doesn't also count as page traffic.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
