name: main-checks

# CHECKLIST.md Phase 7E: the full gate. Runs on every push to master
# (i.e. once a PR merges) and on manual dispatch -- never on a PR branch,
# where pr-checks.yml already gives fast feedback on the cheap subset of
# this. This file is what decides whether a build is releasable: real
# Postgres (including the DB-permission-separation tests pr-checks can't
# run), an isolated migration upgrade/downgrade/upgrade regression, a
# real Kafka broker integration test, clean Docker builds for both
# images, reproducible image artifacts tagged by the commit SHA, and
# finally a full staging deployment exercised by the real smoke and
# resilience suites -- the actual gate for "is this a valid staging
# release", not just "did the unit tests pass".
#
# Dependency/container vulnerability scanning is a separate, independent
# workflow (security.yml, same push-to-master trigger) rather than
# duplicated here -- both workflows must be green on a commit for it to
# be considered releasable; a branch protection rule requiring status
# checks from both is the intended way to enforce that (see
# docs/runbooks/deployment.md's CI section for the exact check names).

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  api-lint-and-sqlite-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: |
          grep -v psycopg2-binary requirements.txt > /tmp/requirements-sqlite.txt
          pip install -r /tmp/requirements-sqlite.txt
      - name: Ruff
        run: ruff check app tests
      - name: SQLite unit + integration tests
        run: python -m pytest tests/unit tests/integration -v

  web-lint-typecheck-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type check
        run: npx tsc -b
      - run: npm test
      - run: npm run build

  ml-workers-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the ml workers image
        run: docker build -t creditguard-ml-workers ./apps/workers
      - name: Ruff
        run: docker run --rm creditguard-ml-workers python -m ruff check ml tests
      - name: Unit tests (synthetic data only — no real training run in CI)
        run: docker run --rm creditguard-ml-workers python -m pytest tests/ -v

  # Real Postgres, full suite -- including tests/integration/test_db_permissions.py
  # (the restricted creditguard_app role's append-only audit-table
  # permissions), which pr-checks.yml's SQLite job cannot exercise at
  # all (SQLite has no roles/GRANTs) and which the *old* test.yml never
  # actually ran in CI either (APP_DATABASE_URL was never set there, so
  # it silently skipped every time). APP_DB_PASSWORD is set explicitly
  # so this job and the migration that creates the role
  # (a4e71d2b014c_add_restricted_runtime_db_role.py) agree on it,
  # rather than relying on its dev-only fallback default.
  api-postgres-tests:
    runs-on: ubuntu-latest
    needs: [api-lint-and-sqlite-tests]
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: creditguard
          POSTGRES_USER: creditguard
          POSTGRES_PASSWORD: creditguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creditguard -d creditguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://creditguard:creditguard@localhost:5432/creditguard
      APP_DB_PASSWORD: creditguard_app_ci_password
      APP_DATABASE_URL: postgresql://creditguard_app:creditguard_app_ci_password@localhost:5432/creditguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migration upgrade (empty DB -> head; creates the restricted creditguard_app role)
        run: flask db upgrade
      - name: Full test suite against real Postgres
        run: python -m pytest tests/unit tests/integration -v

  # Isolated from api-postgres-tests's database on purpose (its own
  # Postgres service, its own port) -- this test downgrades to base and
  # back to head as part of its own fixture, which would otherwise wipe
  # out api-postgres-tests's state if they shared one database (the same
  # reasoning documented in .env.example's MIGRATION_TEST_DATABASE_URL
  # comment and mirrored by docker-compose.yml's separate
  # postgres-migrations-test service for local dev).
  api-migration-regression:
    runs-on: ubuntu-latest
    needs: [api-lint-and-sqlite-tests]
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres-migrations-test:
        image: postgres:16
        env:
          POSTGRES_DB: creditguard
          POSTGRES_USER: creditguard
          POSTGRES_PASSWORD: creditguard
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U creditguard -d creditguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql://creditguard:creditguard@localhost:5434/creditguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migration upgrade/downgrade/upgrade regression
        run: python -m pytest tests/test_migrations.py -v

  # Real broker, real producer, real consumer readback
  # (tests/integration/test_kafka_integration.py) -- nothing before this
  # ever called app/services/outbox_service.py's publish_pending_events()
  # against anything but a fake KafkaProducerLike. Zookeeper mode, not
  # KRaft, to match every other Kafka instance in this repo
  # (docker-compose.yml, docker-compose.staging.yml). KAFKA_ADVERTISED_LISTENERS
  # is set to localhost, not the "kafka" service hostname the compose
  # files use -- this job's own steps run directly on the runner (not
  # inside a container), and reach the kafka *service container* via its
  # published port, so the broker must advertise an address the runner
  # can actually resolve. The kafka/zookeeper service containers still
  # resolve each other by service name on the network GitHub Actions
  # creates for them.
  api-kafka-integration:
    runs-on: ubuntu-latest
    needs: [api-lint-and-sqlite-tests]
    defaults:
      run:
        working-directory: apps/api
    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.6.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
      kafka:
        image: confluentinc/cp-kafka:7.6.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies (SQLite backs the app state; only Kafka itself needs to be real)
        run: |
          grep -v psycopg2-binary requirements.txt > /tmp/requirements-kafka.txt
          pip install -r /tmp/requirements-kafka.txt
      - name: Wait for the Kafka broker to accept connections
        run: |
          for i in $(seq 1 30); do
            python -c "import kafka; kafka.KafkaAdminClient(bootstrap_servers='localhost:9092', request_timeout_ms=3000).close()" && exit 0
            echo "waiting for kafka ($i/30)..."
            sleep 2
          done
          echo "Kafka never became reachable" >&2
          exit 1
      - name: Kafka integration test
        env:
          KAFKA_TEST_BOOTSTRAP_SERVERS: localhost:9092
        run: python -m pytest tests/integration/test_kafka_integration.py -v

  # A green test suite doesn't guarantee the Dockerfile/gunicorn
  # entrypoint actually works standalone -- builds the real image, runs
  # real migrations against a real Postgres, starts the real container,
  # and confirms both health and readiness (the latter proves real DB
  # connectivity from inside the container, not just that the process is up).
  api-build-and-smoke-test:
    runs-on: ubuntu-latest
    needs: [api-lint-and-sqlite-tests]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: creditguard
          POSTGRES_USER: creditguard
          POSTGRES_PASSWORD: creditguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creditguard -d creditguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the api image
        run: docker build -t creditguard-api ./apps/api
      - name: Apply migrations against the service Postgres
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://creditguard:creditguard@localhost:5432/creditguard \
            creditguard-api flask db upgrade
      - name: Start the container
        run: |
          docker run -d --network host --name creditguard-api \
            -e DATABASE_URL=postgresql://creditguard:creditguard@localhost:5432/creditguard \
            -e SECRET_KEY=ci-only \
            creditguard-api
      - name: Wait for health
        run: |
          for _ in $(seq 1 20); do
            if curl -sf http://localhost:5000/api/v1/health; then exit 0; fi
            sleep 1
          done
          echo "API never became healthy" >&2
          docker logs creditguard-api
          exit 1
      - name: Readiness check (confirms DB connectivity from inside the container)
        run: curl -sf http://localhost:5000/api/v1/health/ready
      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs creditguard-api || true

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the web image
        run: |
          docker build -t creditguard-web ./apps/web \
            --build-arg VITE_API_BASE_URL=http://localhost:5100/api/v1 \
            --build-arg VITE_OIDC_AUTHORITY=http://localhost:8181/realms/creditguard \
            --build-arg VITE_OIDC_CLIENT_ID=creditguard-web \
            --build-arg VITE_OIDC_REDIRECT_URI=http://localhost:8090/
      - name: Start the container and check its health endpoint
        run: |
          docker run -d --name creditguard-web -p 8080:8080 creditguard-web
          for _ in $(seq 1 20); do
            if curl -sf http://localhost:8080/healthz; then exit 0; fi
            sleep 1
          done
          echo "web container never became healthy" >&2
          docker logs creditguard-web
          exit 1

  # Reproducible image artifacts tagged by Git SHA (CHECKLIST.md Phase 7E)
  # -- rebuilds both images (the jobs above already proved each one
  # builds cleanly and passes its own smoke check; this is the "official"
  # build that gets tagged and published, not a cache-shared copy of
  # theirs, since Docker layer caches don't cross job boundaries in
  # GitHub Actions without extra machinery this doesn't need). Pushed to
  # GHCR (ghcr.io) -- no external registry account needed, just the
  # workflow's own GITHUB_TOKEN with package-write permission.
  build-and-publish-images:
    runs-on: ubuntu-latest
    needs:
      - api-postgres-tests
      - api-migration-regression
      - api-kafka-integration
      - api-build-and-smoke-test
      - web-build
      - ml-workers-lint-and-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the api image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/api
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./apps/api
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
      - name: Build and push the web image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/web
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./apps/web \
            --build-arg VITE_API_BASE_URL=http://localhost:5100/api/v1 \
            --build-arg VITE_OIDC_AUTHORITY=http://localhost:8181/realms/creditguard \
            --build-arg VITE_OIDC_CLIENT_ID=creditguard-web \
            --build-arg VITE_OIDC_REDIRECT_URI=http://localhost:8090/
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # The actual "is this a valid staging release" gate (CHECKLIST.md Phase
  # 7E) -- spins up the real docker-compose.staging.yml stack (Postgres,
  # Kafka, Keycloak, the built api/web images) on the runner itself (no
  # external staging host exists for this project -- see
  # docs/runbooks/deployment.md's "Known limitations"), seeds it exactly
  # as documented, and requires both the smoke suite and the resilience
  # suite (including the destructive fault-injection tests -- safe here,
  # since this is a throwaway runner nothing else depends on) to pass.
  # Tears the stack down unconditionally afterward.
  staging-release-gate:
    runs-on: ubuntu-latest
    needs: [build-and-publish-images]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate ephemeral CI-only staging secrets
        run: |
          {
            echo "FLASK_ENV=production"
            echo "SECRET_KEY=$(openssl rand -hex 16)"
            echo "CORS_ALLOWED_ORIGINS=http://localhost:8090"
            echo "RATELIMIT_DEFAULT=300 per minute"
            echo "LOG_LEVEL=INFO"
            echo "DB_OWNER_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "KAFKA_ENABLED=false"
            echo "KAFKA_BOOTSTRAP_SERVERS=kafka:9092"
            echo "KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "OIDC_ISSUER=http://localhost:8181/realms/creditguard"
            echo "OIDC_JWKS_URL=http://keycloak:8080/realms/creditguard/protocol/openid-connect/certs"
            echo "OIDC_AUDIENCE=creditguard-api"
            echo "VITE_API_BASE_URL=http://localhost:5100/api/v1"
            echo "VITE_OIDC_AUTHORITY=http://localhost:8181/realms/creditguard"
            echo "VITE_OIDC_CLIENT_ID=creditguard-web"
            echo "VITE_OIDC_REDIRECT_URI=http://localhost:8090/"
          } > .env.staging
          DB_OWNER_PASSWORD=$(grep '^DB_OWNER_PASSWORD=' .env.staging | cut -d= -f2)
          echo "DATABASE_URL=postgresql://creditguard:${DB_OWNER_PASSWORD}@localhost:5533/creditguard" >> .env.staging
          APP_DB_PASSWORD=$(grep '^APP_DB_PASSWORD=' .env.staging | cut -d= -f2)
          echo "APP_DATABASE_URL=postgresql://creditguard_app:${APP_DB_PASSWORD}@localhost:5533/creditguard" >> .env.staging
      - name: Deploy the staging stack
        run: docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
      - name: Wait for the api service to report healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' creditguard-staging-api-1 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then exit 0; fi
            echo "api status: $status ($i/60)"
            sleep 5
          done
          echo "staging api never became healthy" >&2
          docker compose -f docker-compose.staging.yml --env-file .env.staging logs
          exit 1
      - name: Seed staging tenants
        run: docker compose -f docker-compose.staging.yml --env-file .env.staging exec -T api flask seed staging
      - name: Install smoke/resilience test dependencies
        run: |
          pip install -r tests/smoke/requirements.txt
          pip install -r tests/resilience/requirements.txt
      - name: Staging smoke test suite
        run: cd tests/smoke && python -m pytest . -v
      - name: Staging resilience test suite (including destructive fault-injection — safe on this throwaway runner)
        env:
          RUN_RESILIENCE_TESTS: "1"
        run: cd tests/resilience && python -m pytest . -v
      - name: Stack logs (always, for debugging)
        if: always()
        run: docker compose -f docker-compose.staging.yml --env-file .env.staging logs
      - name: Tear down the staging stack (always, even on failure)
        if: always()
        run: docker compose -f docker-compose.staging.yml --env-file .env.staging down -v
