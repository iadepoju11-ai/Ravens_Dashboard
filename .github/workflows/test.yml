name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # install -> ruff -> SQLite unit tests (CHECKLIST.md Phase 7).
  # No services needed, so this is the fastest gate and fails first on
  # the cheapest possible checks.
  api-lint-and-sqlite-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt
      # Excludes psycopg2-binary: not needed for the SQLite-only tests in
      # this job, and the Postgres-backed job below installs the full set.
      - name: Install dependencies
        run: |
          grep -v psycopg2-binary requirements.txt > /tmp/requirements-sqlite.txt
          pip install -r /tmp/requirements-sqlite.txt
      - name: Ruff
        run: ruff check app tests
      - name: SQLite unit + integration tests
        run: python -m pytest tests/unit tests/integration -v

  # Postgres integration tests + migration upgrade test (CHECKLIST.md
  # Phase 7). Exercises the real Alembic migration path and the parts of
  # the suite that only make sense against Postgres (audit chain
  # timestamp handling, the migration smoke test itself).
  api-postgres-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: creditguard
          POSTGRES_USER: creditguard
          POSTGRES_PASSWORD: creditguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creditguard -d creditguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://creditguard:creditguard@localhost:5432/creditguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migration upgrade test (empty DB -> head)
        run: flask db upgrade
      - name: Full test suite against real Postgres
        run: python -m pytest tests/ -v

  # Build the real image and confirm the container actually starts and
  # answers health/readiness — a green test suite doesn't guarantee the
  # Dockerfile/gunicorn entrypoint actually works standalone.
  api-build-and-smoke-test:
    runs-on: ubuntu-latest
    needs: [api-lint-and-sqlite-tests, api-postgres-tests]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: creditguard
          POSTGRES_USER: creditguard
          POSTGRES_PASSWORD: creditguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creditguard -d creditguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the api image
        run: docker build -t creditguard-api ./apps/api
      - name: Apply migrations against the service Postgres
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://creditguard:creditguard@localhost:5432/creditguard \
            creditguard-api flask db upgrade
      - name: Start the container
        run: |
          docker run -d --network host --name creditguard-api \
            -e DATABASE_URL=postgresql://creditguard:creditguard@localhost:5432/creditguard \
            -e SECRET_KEY=ci-only \
            creditguard-api
      - name: Wait for health
        run: |
          for _ in $(seq 1 20); do
            if curl -sf http://localhost:5000/api/v1/health; then exit 0; fi
            sleep 1
          done
          echo "API never became healthy" >&2
          docker logs creditguard-api
          exit 1
      - name: Readiness check (confirms DB connectivity from inside the container)
        run: curl -sf http://localhost:5000/api/v1/health/ready
      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs creditguard-api || true

  ml-workers-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the ml workers image
        run: docker build -t creditguard-ml-workers ./apps/workers
      - name: Ruff
        run: docker run --rm creditguard-ml-workers python -m ruff check ml tests
      - name: Unit tests (synthetic data only — no real training run in CI)
        run: docker run --rm creditguard-ml-workers python -m pytest tests/ -v

  web-lint-typecheck-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type check
        run: npx tsc -b
      - run: npm test
      - run: npm run build
