name: pr-checks

# CHECKLIST.md Phase 7E: the fast gate. Every push to a PR branch runs
# this and only this -- lint, typecheck, and the SQLite-backed unit/
# integration suites. No Docker builds, no Postgres/Kafka services, no
# image publishing. Target is a few minutes so a PR gets feedback
# quickly; everything slower (real Postgres, migration regression, Kafka
# integration, Docker builds, image publishing, the staging release
# gate) lives in main-checks.yml and only runs once a PR actually merges
# to master. Dependency/container vulnerability scanning is its own
# workflow (security.yml) and already runs on every PR too.

on:
  pull_request:
    branches: [master]

jobs:
  api-lint-and-sqlite-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt
      # Excludes psycopg2-binary: not needed for the SQLite-only tests in
      # this job. kafka-python-ng is still installed -- the Kafka
      # integration test itself only runs when a broker is reachable
      # (main-checks.yml), but importing the module must still work here.
      - name: Install dependencies
        run: |
          grep -v psycopg2-binary requirements.txt > /tmp/requirements-sqlite.txt
          pip install -r /tmp/requirements-sqlite.txt
      - name: Ruff
        run: ruff check app tests
      - name: SQLite unit + integration tests
        run: python -m pytest tests/unit tests/integration -v

  web-lint-typecheck-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type check
        run: npx tsc -b
      - run: npm test
      - run: npm run build

  ml-workers-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the ml workers image
        run: docker build -t creditguard-ml-workers ./apps/workers
      - name: Ruff
        run: docker run --rm creditguard-ml-workers python -m ruff check ml tests
      - name: Unit tests (synthetic data only — no real training run in CI)
        run: docker run --rm creditguard-ml-workers python -m pytest tests/ -v
