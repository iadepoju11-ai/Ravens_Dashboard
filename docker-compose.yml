services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: creditguard
      POSTGRES_PASSWORD: creditguard
      POSTGRES_DB: creditguard
    ports:
      # Host port 5433 (not the default 5432) so this stack can run
      # alongside other local Postgres instances without colliding.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditguard -d creditguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Internal container-to-container traffic still uses the default
      # 9092; only the host-side mapping below is remapped to 9093.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      # Host port 9093 (not the default 9092) to avoid colliding with
      # another local Kafka broker.
      - "9093:9092"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak/creditguard-realm.json:/opt/keycloak/data/import/creditguard-realm.json
      - keycloak_data:/opt/keycloak/data
    ports:
      # Host-side only, for the admin console / manual poking around
      # (http://localhost:8081, login admin/admin -- dev credentials,
      # never used outside this local stack). Container-to-container
      # traffic (the api service validating tokens) always uses the
      # internal address, keycloak:8080 -- see OIDC_ISSUER in
      # docker-compose.yml's api service and docs/local-development.md.
      - "8081:8080"

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      # The running app connects as the restricted creditguard_app role
      # (CHECKLIST.md Phase 5 DB permission separation) -- it can read/write
      # ordinary tables but only ever INSERT into audit tables, and has no
      # DDL rights at all. Migrations run separately as the owner role
      # (DATABASE_URL overridden explicitly), see docs/database-migrations.md.
      # Container-to-container networking always uses the service name and
      # the *internal* port, regardless of the host-side port mapping above.
      DATABASE_URL: postgresql://creditguard_app:${APP_DB_PASSWORD:-creditguard_app_dev_password}@postgres:5432/creditguard
      # Same restricted role, addressed the same way, for the permission
      # tests in tests/integration/test_db_permissions.py. .env's copy of
      # this variable is host-side (localhost:5433) for tools run directly
      # on the host -- this override replaces it with the container-internal
      # address so `docker compose run api pytest ...` always exercises the
      # real permission checks rather than silently skipping them.
      APP_DATABASE_URL: postgresql://creditguard_app:${APP_DB_PASSWORD:-creditguard_app_dev_password}@postgres:5432/creditguard
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "5000:5000"
    volumes:
      - ./apps/api:/app
      # Trained model artifacts (apps/workers/ml output) — gitignored,
      # local dev only. Real deployments use an artefact store, not a
      # bind-mounted directory.
      - ./model_artifacts:/app/model_artifacts

  web:
    build:
      context: ./apps/web
    env_file: .env
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app

volumes:
  postgres_data:
  keycloak_data:
