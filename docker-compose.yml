services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: creditguard
      POSTGRES_PASSWORD: creditguard
      POSTGRES_DB: creditguard
    ports:
      # Host port 5433 (not the default 5432) so this stack can run
      # alongside other local Postgres instances without colliding.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditguard -d creditguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Internal container-to-container traffic still uses the default
      # 9092; only the host-side mapping below is remapped to 9093.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      # Host port 9093 (not the default 9092) to avoid colliding with
      # another local Kafka broker.
      - "9093:9092"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # A browser (localhost:8081) and the api container (keycloak:8080)
      # reach Keycloak via *different* addresses -- without a fixed
      # hostname, tokens issued via one path would carry an `iss` claim
      # the other side can't validate. Pinning it to the host-side address
      # makes every token's issuer http://localhost:8081/realms/creditguard
      # regardless of which network path requested it; the api service's
      # OIDC_ISSUER is set to match, and only its JWKS *fetch* address
      # (OIDC_JWKS_URL, below) needs to be the container-reachable one.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8081"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    volumes:
      - ./infra/keycloak/creditguard-realm.json:/opt/keycloak/data/import/creditguard-realm.json
      - keycloak_data:/opt/keycloak/data
    ports:
      # Host-side: the admin console, and now also every browser-facing
      # OIDC flow (the React app's login redirect) -- both go through
      # this port. See KC_HOSTNAME above for why the api container also
      # needs to agree this is the issuer even though it reaches Keycloak
      # over a different address.
      - "8081:8080"

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      # The running app connects as the restricted creditguard_app role
      # (CHECKLIST.md Phase 5 DB permission separation) -- it can read/write
      # ordinary tables but only ever INSERT into audit tables, and has no
      # DDL rights at all. Migrations run separately as the owner role
      # (DATABASE_URL overridden explicitly), see docs/database-migrations.md.
      # Container-to-container networking always uses the service name and
      # the *internal* port, regardless of the host-side port mapping above.
      DATABASE_URL: postgresql://creditguard_app:${APP_DB_PASSWORD:-creditguard_app_dev_password}@postgres:5432/creditguard
      # Same restricted role, addressed the same way, for the permission
      # tests in tests/integration/test_db_permissions.py. .env's copy of
      # this variable is host-side (localhost:5433) for tools run directly
      # on the host -- this override replaces it with the container-internal
      # address so `docker compose run api pytest ...` always exercises the
      # real permission checks rather than silently skipping them.
      APP_DATABASE_URL: postgresql://creditguard_app:${APP_DB_PASSWORD:-creditguard_app_dev_password}@postgres:5432/creditguard
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Must match the `iss` claim on tokens the browser gets from
      # Keycloak (KC_HOSTNAME above) -- not the container-to-container
      # address. The JWKS *fetch* itself can (and must) still go over the
      # container-reachable address; host.docker.internal resolves to the
      # host machine on Docker Desktop, and extra_hosts below makes the
      # same alias work on Linux.
      OIDC_ISSUER: http://localhost:8081/realms/creditguard
      OIDC_JWKS_URL: http://host.docker.internal:8081/realms/creditguard/protocol/openid-connect/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "5000:5000"
    volumes:
      - ./apps/api:/app
      # Trained model artifacts (apps/workers/ml output) — gitignored,
      # local dev only. Real deployments use an artefact store, not a
      # bind-mounted directory.
      - ./model_artifacts:/app/model_artifacts

  web:
    build:
      context: ./apps/web
    env_file: .env
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app

volumes:
  postgres_data:
  keycloak_data:
